name: Update formula

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the formula from the npm registry
        id: update
        run: scripts/update-formula.sh

      - name: Commit and push if the formula changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/
            git commit -m "diya-gl ${{ steps.update.outputs.version }}"
            git push
          else
            echo "No change to commit."
          fi

      - name: Install and test the formula from the tap just pushed
        if: hashFiles('Formula/diya-gl.rb') != ''
        run: |
          brew tap diy-accounting-uk/tap
          brew install --build-from-source diy-accounting-uk/tap/diya-gl
          brew test diy-accounting-uk/tap/diya-gl
